name: CI

on:
  push:
    branches: [main]
    tags:
      # Triggers the publish job below, e.g. `git tag v0.1.0a1`.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libopenblas-dev \
            python3-dev \
            ${{ matrix.compiler == 'clang' && 'clang libomp-dev' || '' }}

      - name: Install Python build dependencies
        # --system: install into actions/setup-python's interpreter
        # directly (build.py's own CMake configure step needs nanobind
        # importable from there), not an isolated uv-managed venv.
        run: uv pip install --system nanobind rich

      - name: Build (Release)
        # --no-tests: CMakeLists.txt no longer registers any CTest tests
        # (the old test/benchmark executables were removed), so running
        # ctest here would just fail on "no tests found" for no useful
        # reason.
        run: python build.py Release --no-tests

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.compiler }}
          path: logs/build.log
          if-no-files-found: warn

  build-and-test-windows:
    name: build-and-test (windows, clang)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up MSVC developer environment
        # Clang on Windows still links via the MSVC toolchain (link.exe,
        # the Windows SDK, and the vcpkg-built libraries below all expect
        # this), so this needs to be active for every step after it.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install LLVM/Clang
        # Installed via choco (which uses the official LLVM Windows
        # installer), so it lands at the same C:\Program Files\LLVM path
        # CONTRIBUTING.md documents - including libomp.lib, which the
        # configure step below points at explicitly.
        run: choco install llvm -y --no-progress

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg
            !C:/vcpkg/buildtrees
            !C:/vcpkg/packages
            !C:/vcpkg/downloads
          key: vcpkg-windows-openblas-v1

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: C:/vcpkg/vcpkg.exe install openblas --triplet x64-windows

      - name: Install Python build dependencies
        run: uv pip install --system nanobind rich

      - name: Configure (CMake, using the windows-clang preset)
        # Uses CMakePresets.json's "windows-clang" preset directly, rather
        # than retyping the same flags here, so CI exercises the exact
        # preset a human would run locally - if the preset breaks, CI
        # catches it instead of it silently rotting.
        run: cmake --preset windows-clang 2>&1 | Tee-Object -FilePath windows-configure.log

      - name: Build
        run: cmake --build build/Release --config Release --parallel 2>&1 | Tee-Object -FilePath windows-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: |
            windows-configure.log
            windows-build.log
          if-no-files-found: ignore

  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pyproject.toml's [dependency-groups] dev covers everything
        # examples/ imports beyond the runtime deps, plus rich (for
        # build.py's optional dashboard) and pyright itself. --no-install-
        # project: skips building the C++ extension (needs the full
        # toolchain, not needed just to type-check). experiments/ is
        # intentionally excluded in pyrightconfig.json instead, so its
        # deps aren't required here.
        run: uv sync --group dev --no-install-project

      - name: Run pyright
        # --no-sync: `uv run` alone re-syncs, which rebuilds the C++ extension.
        run: uv run --no-sync pyright

  build-wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS intentionally excluded for now: macos-latest runners are
        # arm64, and CMakeLists.txt's SIMD flags (DEEPITY_ARCH_FLAGS's
        # x86-64-v2, SLEEF_ENABLE_AVX2/AVX512F) are x86-only with no
        # arch-conditional branching yet.
        #
        # windows-2022, not windows-latest: windows-latest just rolled to
        # windows-2025-vs2026 (Visual Studio 18), and CUDA 12.6's Windows
        # toolkit only ships MSBuild integration files for VS versions
        # that existed at its own 2024 release -- enable_language(CUDA)
        # fails with "No CUDA toolset found" on VS18 as a result (this
        # is independent of the Ninja generator Deepity otherwise uses;
        # CMake's CUDA compiler-id detection on Windows always goes
        # through MSBuild). windows-2022 ships VS2022, which CUDA 12.6
        # does support. Revisit once a CUDA release ships VS18/2026
        # integration files.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Windows/macOS cibuildwheel runs natively, not in a container, so
      # it needs uv on the runner's own PATH (Linux gets uv inside the
      # manylinux container already).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      # Linux gets the CUDA toolkit via pyproject.toml's before-all instead
      # (that runs inside cibuildwheel's manylinux container; this step
      # can't reach in there). cibuildwheel runs natively on Windows, so
      # it has to land on the runner directly, before the Build wheels step.
      # Not continue-on-error like ccache below: an unused toolkit install
      # failing silently isn't the same as a broken CUDA build failing
      # silently -- we want this one loud while we're finding out whether
      # it even works.
      - name: Install CUDA toolkit (Windows)
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          # 'local' (the action's own default): downloads the full
          # installer and installs everything, rather than 'network' +
          # sub-packages, whose empty-array-with-network-method behavior
          # the action's own README doesn't actually pin down. Slower,
          # but unambiguous -- sub-package pruning is an optimization for
          # once this is known to work at all.
          method: local
          use-github-cache: true

      - name: Verify CUDA toolkit (Windows)
        if: matrix.os == 'windows-2022'
        run: nvcc --version

      # ccache isn't exercised by this install, so a flaky choco/GitHub-CDN
      # download (seen: 504 Gateway Timeout fetching the release zip)
      # shouldn't fail the whole release pipeline over it --
      # CMakeLists.txt's find_program(DEEPITY_CCACHE_PROGRAM ccache) no-ops
      # if it's missing.
      - name: Install ccache (Windows)
        if: matrix.os == 'windows-2022'
        continue-on-error: true
        run: choco install ccache -y --no-progress

      # Keyed on oneDNN's pinned version; bump the suffix if that changes.
      - name: Restore ccache compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-wheels-${{ matrix.os }}-onednn-v3.13.4-${{ github.sha }}
          restore-keys: |
            ccache-wheels-${{ matrix.os }}-onednn-v3.13.4-

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT_LINUX: CCACHE_DIR=/host${{ github.workspace }}/.ccache
          CIBW_ENVIRONMENT_WINDOWS: CCACHE_DIR=${{ github.workspace }}\.ccache

      # if: always() -- restore/save split so a failed build still keeps
      # whatever ccache populated, instead of actions/cache's default
      # save-on-post (which skips entirely once a later step fails).
      - name: Save ccache compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-wheels-${{ matrix.os }}-onednn-v3.13.4-${{ github.sha }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Convenience downloads attached to the GitHub Release, separate from
  # the PyPI publish job above: "fast" profile (-march=x86-64-v3) rather
  # than PyPI's maximally-portable "distributed" wheels, CPU-only.
  release-fast-wheels:
    name: fast wheels (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: see build-wheels' identical matrix entry above for why.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      # See build-wheels' identical steps for why.
      - name: Install CUDA toolkit (Windows)
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: local
          use-github-cache: true

      - name: Verify CUDA toolkit (Windows)
        if: matrix.os == 'windows-2022'
        run: nvcc --version

      # continue-on-error: see build-wheels' identical step for why.
      - name: Install ccache (Windows)
        if: matrix.os == 'windows-2022'
        continue-on-error: true
        run: choco install ccache -y --no-progress

      - name: Restore ccache compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fast-wheels-${{ matrix.os }}-onednn-v3.13.4-${{ github.sha }}
          restore-keys: |
            ccache-fast-wheels-${{ matrix.os }}-onednn-v3.13.4-

      # CMAKE_ARGS overrides pyproject.toml's portable-build arch flags --
      # CMake's own last-one-wins for a repeated -D takes this override.
      - name: Build wheels (fast profile)
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT_LINUX: CMAKE_ARGS=-DDEEPITY_ARCH_FLAGS=-march=x86-64-v3 CCACHE_DIR=/host${{ github.workspace }}/.ccache
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_ARGS=-DDEEPITY_MSVC_ARCH_FLAGS=/arch:AVX2 CCACHE_DIR=${{ github.workspace }}\.ccache

      - name: Save ccache compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fast-wheels-${{ matrix.os }}-onednn-v3.13.4-${{ github.sha }}

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: wheelhouse/*.whl
          prerelease: true
          draft: true

  release-cpp-binaries:
    name: C++ binaries (linux)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libopenblas-dev

      - name: Build (fast profile, CPU-only, library only)
        run: python3 build.py --fast --no-cuda --no-tests --no-python-bindings

      # Ships the whole include/ tree, not just include/deepity/ --
      # ModelIO.h pulls in the vendored nlohmann/json.hpp header too.
      - name: Package library + headers
        run: |
          pkg="deepity-${GITHUB_REF_NAME#v}-linux-x86_64"
          mkdir -p "$pkg/lib" "$pkg/include"
          cp build/Release/bin/libDeepity.a "$pkg/lib/"
          cp -r include/. "$pkg/include/"
          tar czf "${pkg}.tar.gz" "$pkg"

      - name: Attach archive to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: deepity-*.tar.gz
          prerelease: true
          draft: true

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    # Only an actual release tag push runs this -- a plain push to main or
    # a PR still builds/uploads wheels+sdist as artifacts above (so a
    # broken build is caught early) but stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Download wheels (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - name: Download wheels (windows)
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-2022
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      # Trusted Publishing (OIDC) -- no token needed, see pypi.org's
      # Publishing settings for this project's registered publisher.
      - name: Publish to PyPI
        run: uv publish
