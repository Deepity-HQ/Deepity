name: CI

on:
  push:
    branches: [main]
    tags:
      # Publishes to PyPI (see the publish job below) -- push a tag
      # matching one of these to cut a release, e.g. `git tag v0.1.0a1 &&
      # git push --tags`. Covers plain releases plus alpha/beta/rc
      # pre-releases, matching pyproject.toml's PEP 440 version field.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libopenblas-dev \
            python3-dev \
            ${{ matrix.compiler == 'clang' && 'clang libomp-dev' || '' }}

      - name: Install Python build dependencies
        # --system: install into actions/setup-python's interpreter
        # directly (build.py's own CMake configure step needs nanobind
        # importable from there), not an isolated uv-managed venv.
        run: uv pip install --system nanobind rich

      - name: Build (Release)
        # --no-tests: CMakeLists.txt no longer registers any CTest tests
        # (the old test/benchmark executables were removed), so running
        # ctest here would just fail on "no tests found" for no useful
        # reason.
        run: python build.py Release --no-tests

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.compiler }}
          path: logs/build.log
          if-no-files-found: warn

  build-and-test-windows:
    name: build-and-test (windows, clang)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up MSVC developer environment
        # Clang on Windows still links via the MSVC toolchain (link.exe,
        # the Windows SDK, and the vcpkg-built libraries below all expect
        # this), so this needs to be active for every step after it.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install LLVM/Clang
        # Installed via choco (which uses the official LLVM Windows
        # installer), so it lands at the same C:\Program Files\LLVM path
        # CONTRIBUTING.md documents - including libomp.lib, which the
        # configure step below points at explicitly.
        run: choco install llvm -y --no-progress

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg
            !C:/vcpkg/buildtrees
            !C:/vcpkg/packages
            !C:/vcpkg/downloads
          key: vcpkg-windows-openblas-v1

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: C:/vcpkg/vcpkg.exe install openblas --triplet x64-windows

      - name: Install Python build dependencies
        run: uv pip install --system nanobind rich

      - name: Configure (CMake, using the windows-clang preset)
        # Uses CMakePresets.json's "windows-clang" preset directly, rather
        # than retyping the same flags here, so CI exercises the exact
        # preset a human would run locally - if the preset breaks, CI
        # catches it instead of it silently rotting.
        run: cmake --preset windows-clang 2>&1 | Tee-Object -FilePath windows-configure.log

      - name: Build
        run: cmake --build build/Release --config Release --parallel 2>&1 | Tee-Object -FilePath windows-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: |
            windows-configure.log
            windows-build.log
          if-no-files-found: ignore

  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pyproject.toml's [dependency-groups] dev covers everything
        # examples/ imports beyond the runtime deps, plus rich (for
        # build.py's optional dashboard) and pyright itself. --no-install-
        # project: skips building the C++ extension (needs the full
        # toolchain, not needed just to type-check). experiments/ is
        # intentionally excluded in pyrightconfig.json instead, so its
        # deps aren't required here.
        run: uv sync --group dev --no-install-project

      - name: Run pyright
        # --no-sync: `uv run` re-syncs by default, which (without
        # --no-install-project) means building the C++ extension via
        # scikit-build-core -- needs the full CMake/compiler toolchain and
        # defeats the point of the --no-install-project sync just above.
        # Reuses that exact venv instead.
        run: uv run --no-sync pyright

  build-wheels:
    name: wheels (${{ matrix.os }})
    needs: [build-and-test, build-and-test-windows]
    strategy:
      fail-fast: false
      matrix:
        # macOS intentionally excluded for now: macos-latest runners are
        # arm64, and CMakeLists.txt's SIMD flags (DEEPITY_ARCH_FLAGS's
        # x86-64-v2, SLEEF_ENABLE_AVX2/AVX512F) are x86-only with no
        # arch-conditional branching yet.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # --- Linux and macOS need no host-side setup: OpenBLAS/libgomp/
      # ccache install inside the manylinux container (Linux) or via
      # Homebrew (macOS) through the before-all hooks in pyproject.toml's
      # [tool.cibuildwheel.linux] / [tool.cibuildwheel.macos] tables.
      # Windows has no such container-level hook (cibuildwheel runs
      # directly on the runner), so ccache is installed as a normal step
      # here instead, same as build-and-test-windows already does for
      # Ninja/LLVM above.
      - name: Install ccache (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ccache -y --no-progress

      # oneDNN's from-source build is by far the dominant compile cost
      # here (~94 minutes from scratch, see this project's own
      # build-speed investigation) -- ccache turns that into a cache hit
      # on every run after the first. Keyed on its pinned version
      # (CMakeLists.txt's GIT_TAG) so an oneDNN bump naturally starts a
      # fresh cache instead of silently reusing stale objects; bump the
      # key's suffix below if that pin ever changes.
      #
      # Linux builds happen inside cibuildwheel's manylinux container,
      # which mounts the host filesystem root at /host -- CCACHE_DIR
      # below points there specifically so the cache this step
      # restores (a HOST path) is what the container actually reads/
      # writes, not some path local to the container's own throwaway
      # filesystem.
      - name: Cache ccache compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-wheels-${{ matrix.os }}-onednn-v3.13.4-${{ github.sha }}
          restore-keys: |
            ccache-wheels-${{ matrix.os }}-onednn-v3.13.4-

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT_LINUX: CCACHE_DIR=/host${{ github.workspace }}/.ccache
          CIBW_ENVIRONMENT_WINDOWS: CCACHE_DIR=${{ github.workspace }}\.ccache

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    # Only an actual release tag push runs this -- a plain push to main or
    # a PR still builds/uploads wheels+sdist as artifacts above (so a
    # broken build is caught early) but stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Download wheels (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - name: Download wheels (windows)
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-latest
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      # No token/password needed: PyPI Trusted Publishing uses this job's
      # OIDC identity (permissions.id-token above + the "pypi" environment)
      # instead. One-time setup this repo still needs before this job can
      # actually succeed, neither of which can be done from here:
      #   1. A GitHub Environment named "pypi" under this repo's Settings
      #      -> Environments.
      #   2. A Trusted Publisher registered on the PyPI project ("pydeepity")
      #      under pypi.org account Settings -> Publishing, with owner/repo
      #      set to this repo, workflow filename "ci.yml", and environment
      #      name "pypi" -- must match exactly or publishing is rejected.
      - name: Publish to PyPI
        run: uv publish
