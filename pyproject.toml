[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.13.0",
    "cmake>=3.21",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "pydeepity"
version = "0.1.0a6"
description = "A high-performance Predictive Coding library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jack R" },
]
dependencies = [
    "numpy",
    "rich",
]

# Not "License :: OSI Approved :: MIT License" alongside this -- PEP 639's
# `license` field above is the modern replacement for that classifier,
# and pairing both is a deprecated pattern some build backends warn on.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

# `pip install pydeepity[cuda]` -- pulls the CUDA runtime/cuBLAS shared
# libraries DeepityCUDA.so/.dll (bundled in the wheel itself, see
# CMakeLists.txt's DeepityCUDA target) dlopen()s at the moment GPU
# support is actually requested. Deliberately not vendored into the
# wheel directly: PyPI's size limits make that a non-starter the moment
# cuBLAS is linked (see the auditwheel --exclude lists below), and this
# is the pattern every CUDA-linked PyPI package (PyTorch, JAX, ONNX
# Runtime) has converged on for exactly that reason. Versions pinned to
# match the CUDA 12.6 toolkit CI builds against (see
# [tool.cibuildwheel.linux]'s before-all).
[project.optional-dependencies]
cuda = [
    "nvidia-cuda-runtime-cu12==12.6.*",
    "nvidia-cublas-cu12==12.6.*",
]

[project.urls]
Homepage = "https://github.com/Deepity-HQ/Deepity"
Repository = "https://github.com/Deepity-HQ/Deepity"
Issues = "https://github.com/Deepity-HQ/Deepity/issues"

# Dev-only deps; install with `uv sync --group dev --no-install-project`
# (use build.py to actually build the C++ extension, see README.md).
[dependency-groups]
dev = [
    "torch>=2.8.0",
    "torchvision",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "setuptools",
    "pyright",
]

# ══════════════════════════════════════════════════════════════════════════
# scikit-build-core: how `pip install .` / `pip wheel .` invokes CMake
# ══════════════════════════════════════════════════════════════════════════
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

# Distribution is "pydeepity" (see [project] name) but imports as `deepity`.
wheel.packages = ["deepity"]

# Without this, every FetchContent dep's own install() rules (oneDNN,
# SLEEF, benchmark, ...) land in the wheel too -- see CMakeLists.txt's
# python_runtime COMPONENT tags on Deepity's own install() calls.
install.components = ["python_runtime"]

sdist.exclude = [
    "tests",
    "experiments",
    "logs",
    "build",
    ".github",
]

[tool.scikit-build.cmake.define]
# Portability over speed; build.py's --distributed profile mirrors this.
DEEPITY_BUILD_TESTS = "OFF"
DEEPITY_BUILD_PYTHON_BINDINGS = "ON"
# Safe to leave ON unconditionally (CMakeLists.txt's find_package(CUDAToolkit
# QUIET) no-ops to CPU-only if the toolkit isn't present) -- and now that
# CUDA lives in the separate DeepityCUDA plugin (dlopen()'d at runtime,
# never linked into deepity_ext itself), turning this on no longer risks
# breaking `import deepity` on a machine with no CUDA toolkit/runtime at
# all. See CMakeLists.txt's DeepityCUDA target and
# CUDAPluginLoader.h/.cpp.
DEEPITY_ENABLE_CUDA = "ON"
DEEPITY_ARCH_FLAGS = "-march=x86-64-v2 -mtune=generic"
DEEPITY_MSVC_ARCH_FLAGS = ""

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
build-verbosity = 1
# "latest", not the default "pinned": pinned means downloading one exact
# virtualenv version's .pyz from a github.com/.../blob/...?raw=true URL,
# which just 504'd twice in a row in CI. "latest" resolves virtualenv via
# a normal `pip install` instead -- a different, more reliable path --
# and version drift here doesn't matter, since this is a build-time tool,
# not anything that ships in the wheel.
dependency-versions = "latest"
# Not "build"/"build[uv]": `python -m build` adds cwd to sys.path, and
# this repo's own root-level build.py shadows the `build` package there.
build-frontend = "pip"

test-requires = ["numpy"]
test-command = "python -c \"import deepity; print('deepity OK:', deepity.__file__)\""

[tool.cibuildwheel.linux]
# manylinux2014's stock GCC is too old for -std=c++20; the _2_28 images
# (AlmaLinux 8 based) ship GCC 12+, which is required here.
manylinux-x86_64-image = "manylinux_2_28"
# ccache isn't in AlmaLinux 8's base repos, only EPEL.
#
# CUDA toolkit: installed from NVIDIA's own RHEL8 rpm repo (manylinux_2_28
# is AlmaLinux 8, which that repo targets directly). Using the
# `cuda-toolkit-12-6` meta-package rather than hand-picking sub-packages
# (cuda-nvcc-*, libcublas-devel-*, ...) -- this mirror's cuBLAS packages
# don't follow the libcublas-devel-<ver> naming the other components do
# (confirmed: no libcublas-devel-12-6 exists there at all), so the
# meta-package's own dependency resolution is more reliable than guessing
# names. `nvcc --version` at the end turns a broken install into a loud
# CI failure here instead of a silent CPU-only fallback later.
before-all = "dnf install -y epel-release && dnf install -y openblas-devel libgomp ccache && dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo && dnf install -y cuda-toolkit-12-6 && ln -sf /usr/local/cuda-12.6 /usr/local/cuda && /usr/local/cuda/bin/nvcc --version"
# No `environment` table here for PATH/CUDAToolkit_ROOT/CUDACXX: this
# section's values get fully overridden (not merged) by ci.yml's
# CIBW_ENVIRONMENT_LINUX, since cibuildwheel treats that env var as a
# complete replacement for this TOML table whenever both are set --
# confirmed the hard way in CI, after setting them here alone did
# nothing (find_package(CUDAToolkit) kept succeeding regardless, via
# CMake's own hardcoded /usr/local/cuda default search path, while
# enable_language(CUDA) kept failing since it has no such fallback and
# never actually saw these variables). They live in ci.yml instead now.
# --exclude: without this, auditwheel's default repair tries to vendor
# every shared lib DeepityCUDA.so links against -- including cuBLAS --
# straight into the wheel, which is how a <2MB wheel becomes >400MB and
# blows past PyPI's size cap (see pyproject.toml's [project.optional-
# dependencies] cuda comment for the actual precedent this follows).
# SONAMEs below match CUDA 12.x's convention (major-version-only, stable
# across 12.0-12.6); unverified against a real built wheel yet -- run
# `auditwheel show` on the next CI-built wheel and correct this list if
# it's wrong, same as this file's ccache-install history.
repair-wheel-command = "auditwheel repair -w {dest_dir} --exclude libcublas.so.12 --exclude libcublasLt.so.12 --exclude libcudart.so.12 {wheel}"

[tool.cibuildwheel.macos]
# Not exercised by CI (arm64 runners, but DEEPITY_ARCH_FLAGS is x86-only).
before-all = "brew install openblas libomp"
environment = { CMAKE_PREFIX_PATH = "/usr/local/opt/openblas:/usr/local/opt/libomp:/opt/homebrew/opt/openblas:/opt/homebrew/opt/libomp" }
archs = ["x86_64"]

[tool.cibuildwheel.windows]
before-build = "uv pip install delvewheel"
# --exclude: Windows counterpart of the Linux auditwheel --exclude list
# above, same reason. DLL names match CUDA 12.x's Windows naming
# convention; unverified against a real built wheel yet, same caveat as
# the Linux list.
repair-wheel-command = "delvewheel repair --add-path deepity --exclude cublas64_12.dll --exclude cublasLt64_12.dll --exclude cudart64_12.dll -w {dest_dir} {wheel}"
