[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.13.0",
    "cmake>=3.21",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "pydeepity"
version = "0.1.0a1"
description = "A high-performance Predictive Coding library."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Jack R" },
]
dependencies = [
    "numpy",
    "rich",
    "torch>=2.8.0",
]
# Not "License :: OSI Approved :: MIT License" alongside this -- PEP 639's
# `license` field above is the modern replacement for that classifier,
# and pairing both is a deprecated pattern some build backends warn on.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/Ra4ster/Deepity"
Repository = "https://github.com/Ra4ster/Deepity"
Issues = "https://github.com/Ra4ster/Deepity/issues"

# ══════════════════════════════════════════════════════════════════════════
# Dev dependencies (PEP 735): everything examples/research/ import beyond
# the runtime deps above, plus pyright (CI's typecheck job,
# CONTRIBUTING.md's pre-push checklist). NOT required to build or use the
# compiled deepity extension itself (see CMakeLists.txt for
# that) -- install with `uv sync --group dev --no-install-project`
# (--no-install-project skips building the C++ extension via this path;
# use build.py for that instead, see README.md).
# ══════════════════════════════════════════════════════════════════════════
[dependency-groups]
dev = [
    "torchvision",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "setuptools",
    "pyright",
]

# ══════════════════════════════════════════════════════════════════════════
# scikit-build-core: how `pip install .` / `pip wheel .` invokes CMake
# ══════════════════════════════════════════════════════════════════════════
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

# Pure-Python sources under deepity/ (__init__.py, utils.py, etc.) get
# merged with whatever CMake's install() step places under deepity/ (the
# compiled deepity*.so) into a single wheel. The distribution is named
# "pydeepity" (see [project] name above) but imports as `deepity`, same
# convention as e.g. scikit-learn/sklearn.
wheel.packages = ["deepity"]

sdist.exclude = [
    "tests",
    "experiments",
    "logs",
    "build",
    ".github",
]

[tool.scikit-build.cmake.define]
# every flag here is chosen for maximum portability, not maximum speed.
# See CMakeLists.txt's DEEPITY_ARCH_FLAGS/DEEPITY_MSVC_ARCH_FLAGS comments,
# and build.py's --distributed profile, which mirrors this exact config for
# local testing (`python build.py Release --distributed --no-cuda`).
DEEPITY_BUILD_TESTS = "OFF"
DEEPITY_BUILD_PYTHON_BINDINGS = "ON"
DEEPITY_ENABLE_CUDA = "OFF"
DEEPITY_ARCH_FLAGS = "-march=x86-64-v2 -mtune=generic"
DEEPITY_MSVC_ARCH_FLAGS = ""

# ══════════════════════════════════════════════════════════════════════════
# cibuildwheel: which wheels get built, and what each platform needs
# installed before CMake can configure successfully.
# ══════════════════════════════════════════════════════════════════════════
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
build-verbosity = 1
# uv instead of pip for every per-interpreter build env in the matrix below
# (cp39..cp313 x each OS) -- meaningfully faster dependency resolution/
# install per isolated env than pip. Preinstalled by cibuildwheel itself on
# Windows/macOS when not already on PATH; the manylinux container gets it
# the same way.
build-frontend = "uv"

test-requires = ["numpy"]
test-command = "python -c \"import deepity; print('deepity OK:', deepity.__file__)\""

[tool.cibuildwheel.linux]
# manylinux2014's stock GCC is too old for -std=c++20; the _2_28 images
# (AlmaLinux 8 based) ship GCC 12+, which is required here.
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y openblas-devel libgomp ccache"

[tool.cibuildwheel.macos]
# NOT currently exercised by CI (see ci.yml's build-wheels matrix comment):
# macos-latest runners are arm64, and CMakeLists.txt's SIMD flags are
# x86-only with no arch-conditional branching yet, so a wheel build here
# fails before it gets anywhere near this config actually mattering. Left
# in place as the starting point for whoever picks that fix up.
before-all = "brew install openblas libomp"
# find_package(BLAS) / OpenMP need an explicit nudge on macOS since Homebrew
# installs outside the paths Apple's toolchain searches by default.
environment = { CMAKE_PREFIX_PATH = "/usr/local/opt/openblas:/usr/local/opt/libomp:/opt/homebrew/opt/openblas:/opt/homebrew/opt/libomp" }
# x86_64 only for now: DEEPITY_ARCH_FLAGS above is an x86 -march string, and
# CMakeLists.txt's SLEEF config force-enables AVX2/AVX512F unconditionally -
# neither means anything when cross-compiling for arm64. Building real
# arm64/Apple Silicon wheels needs CMakeLists.txt itself to branch SIMD
# flags on target architecture, not just this file. Tracked as follow-up.
archs = ["x86_64"]

[tool.cibuildwheel.windows]
before-build = "uv pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path deepity -w {dest_dir} {wheel}"
