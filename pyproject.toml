[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.13.0",
    "cmake>=3.21",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "pydeepity"
version = "0.1.0a6"
description = "A high-performance Predictive Coding library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jack R" },
]
dependencies = [
    "numpy",
    "rich",
]
# Not "License :: OSI Approved :: MIT License" alongside this -- PEP 639's
# `license` field above is the modern replacement for that classifier,
# and pairing both is a deprecated pattern some build backends warn on.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/Deepity-HQ/Deepity"
Repository = "https://github.com/Deepity-HQ/Deepity"
Issues = "https://github.com/Deepity-HQ/Deepity/issues"

# Dev-only deps; install with `uv sync --group dev --no-install-project`
# (use build.py to actually build the C++ extension, see README.md).
[dependency-groups]
dev = [
    "torch>=2.8.0",
    "torchvision",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "setuptools",
    "pyright",
]

# ══════════════════════════════════════════════════════════════════════════
# scikit-build-core: how `pip install .` / `pip wheel .` invokes CMake
# ══════════════════════════════════════════════════════════════════════════
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

# Distribution is "pydeepity" (see [project] name) but imports as `deepity`.
wheel.packages = ["deepity"]

# Without this, every FetchContent dep's own install() rules (oneDNN,
# SLEEF, benchmark, ...) land in the wheel too -- see CMakeLists.txt's
# python_runtime COMPONENT tags on Deepity's own install() calls.
install.components = ["python_runtime"]

sdist.exclude = [
    "tests",
    "experiments",
    "logs",
    "build",
    ".github",
]

[tool.scikit-build.cmake.define]
# Portability over speed; build.py's --distributed profile mirrors this.
DEEPITY_BUILD_TESTS = "OFF"
DEEPITY_BUILD_PYTHON_BINDINGS = "ON"
DEEPITY_ENABLE_CUDA = "OFF"
DEEPITY_ARCH_FLAGS = "-march=x86-64-v2 -mtune=generic"
DEEPITY_MSVC_ARCH_FLAGS = ""

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
build-verbosity = 1
# Not "build"/"build[uv]": `python -m build` adds cwd to sys.path, and
# this repo's own root-level build.py shadows the `build` package there.
build-frontend = "pip"

test-requires = ["numpy"]
test-command = "python -c \"import deepity; print('deepity OK:', deepity.__file__)\""

[tool.cibuildwheel.linux]
# manylinux2014's stock GCC is too old for -std=c++20; the _2_28 images
# (AlmaLinux 8 based) ship GCC 12+, which is required here.
manylinux-x86_64-image = "manylinux_2_28"
# ccache isn't in AlmaLinux 8's base repos, only EPEL.
#
# CUDA toolkit: installed from NVIDIA's own RHEL8 rpm repo (manylinux_2_28
# is AlmaLinux 8, which that repo targets directly). Using the
# `cuda-toolkit-12-6` meta-package rather than hand-picking sub-packages
# (cuda-nvcc-*, libcublas-devel-*, ...) -- this mirror's cuBLAS packages
# don't follow the libcublas-devel-<ver> naming the other components do
# (confirmed: no libcublas-devel-12-6 exists there at all), so the
# meta-package's own dependency resolution is more reliable than guessing
# names. `nvcc --version` at the end turns a broken install into a loud
# CI failure here instead of a silent CPU-only fallback later.
before-all = "dnf install -y epel-release && dnf install -y openblas-devel libgomp ccache && dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo && dnf install -y cuda-toolkit-12-6 && ln -sf /usr/local/cuda-12.6 /usr/local/cuda && /usr/local/cuda/bin/nvcc --version"
environment = { PATH = "/usr/local/cuda/bin:$PATH", CUDAToolkit_ROOT = "/usr/local/cuda" }

[tool.cibuildwheel.macos]
# Not exercised by CI (arm64 runners, but DEEPITY_ARCH_FLAGS is x86-only).
before-all = "brew install openblas libomp"
environment = { CMAKE_PREFIX_PATH = "/usr/local/opt/openblas:/usr/local/opt/libomp:/opt/homebrew/opt/openblas:/opt/homebrew/opt/libomp" }
archs = ["x86_64"]

[tool.cibuildwheel.windows]
before-build = "uv pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path deepity -w {dest_dir} {wheel}"
